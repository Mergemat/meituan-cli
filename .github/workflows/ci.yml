name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Binary runs without the source tree
        run: |
          mv node_modules /tmp/node_modules
          ./dist/meituan-cli --version
          ./dist/meituan-cli help > /dev/null
