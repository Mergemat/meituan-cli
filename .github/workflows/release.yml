name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build binaries
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build src/cli.ts --compile --minify --target="bun-$target" \
              --outfile "dist/meituan-cli-$target"
          done
      - name: Binary runs without the source tree
        run: |
          mv node_modules /tmp/node_modules
          ./dist/meituan-cli-linux-x64 --version
          ./dist/meituan-cli-linux-x64 help > /dev/null
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/meituan-cli-* --generate-notes
